name: Build APKs

on:
  push:
    branches: [main]
    paths:
      - "dmd_client/**"
      - "dmd_pro_courier/**"
      - "dmd_design/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [dmd_client, dmd_pro_courier]
    steps:
      - uses: actions/checkout@v4

      - name: Write Firebase google-services.json
        working-directory: ${{ matrix.app }}
        run: printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ matrix.app }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ matrix.app }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ matrix.app }}
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-release-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  publish-apks:
    name: Commit APKs into dmdapk/
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dmd_client-release-apk
          path: _dl/dmd_client

      - uses: actions/download-artifact@v4
        with:
          name: dmd_pro_courier-release-apk
          path: _dl/dmd_pro_courier

      - name: Move APKs into dmdapk/
        run: |
          mkdir -p dmdapk
          cp _dl/dmd_client/app-release.apk dmdapk/dmd_client.apk
          cp _dl/dmd_pro_courier/app-release.apk dmdapk/dmd_pro_courier.apk
          rm -rf _dl

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dmdapk/dmd_client.apk dmdapk/dmd_pro_courier.apk
          if git diff --cached --quiet; then
            echo "APKs unchanged, nothing to commit"
          else
            git commit -m "Update built APKs in dmdapk/ [skip ci]"
            git push
          fi
